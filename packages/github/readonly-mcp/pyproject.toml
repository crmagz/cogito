[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cogito-github-readonly-mcp"
version = "0.1.0"
description = "Cogito's GitHub App-backed read-only MCP connector"
requires-python = ">=3.14"
dependencies = [
    "cryptography==50.0.0",
    "httpx==0.28.1",
    "mcp==1.26.0",
]

[project.optional-dependencies]
dev = [
    "jsonschema==4.26.0",
    "PyYAML==6.0.3",
    "pytest==9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cogito_github_readonly_mcp"]
