# Single-node Kind profile. Mimir remains distributed, but its production
# Kafka ingest path, caches, and rollout webhook are disabled.
rollout_operator:
  enabled: false
minio:
  enabled: false
kafka:
  enabled: false

mimir:
  structuredConfig:
    multitenancy_enabled: false
    ingest_storage:
      enabled: false
    ingester:
      push_grpc_method_enabled: true
    alertmanager_storage:
      backend: s3
      s3:
        endpoint: cogito-minio.cogito.svc.cluster.local:9000
        bucket_name: mimir-alertmanager
        access_key_id: minioadmin
        secret_access_key: minioadmin
        insecure: true
    blocks_storage:
      backend: s3
      s3:
        endpoint: cogito-minio.cogito.svc.cluster.local:9000
        bucket_name: mimir-blocks
        access_key_id: minioadmin
        secret_access_key: minioadmin
        insecure: true
    ruler_storage:
      backend: s3
      s3:
        endpoint: cogito-minio.cogito.svc.cluster.local:9000
        bucket_name: mimir-ruler
        access_key_id: minioadmin
        secret_access_key: minioadmin
        insecure: true

alertmanager:
  replicas: 1
  persistentVolume:
    enabled: true
    size: 2Gi
compactor:
  persistentVolume:
    size: 2Gi
distributor:
  replicas: 1
ingester:
  replicas: 1
  persistentVolume:
    size: 5Gi
  zoneAwareReplication:
    enabled: false
querier:
  replicas: 1
query_frontend:
  replicas: 1
query_scheduler:
  replicas: 1
ruler:
  replicas: 1
store_gateway:
  replicas: 1
  persistentVolume:
    size: 2Gi
  zoneAwareReplication:
    enabled: false
chunks-cache:
  enabled: false
index-cache:
  enabled: false
metadata-cache:
  enabled: false
results-cache:
  enabled: false
