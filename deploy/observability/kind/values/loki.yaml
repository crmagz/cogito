# Kind-only S3-compatible object storage. Production supplies a distinct S3
# bucket and workload identity through an environment-owned values file.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  # The Kind local-path provisioner shares the node filesystem with container
  # images. Keep a 2% headroom while avoiding Loki's default 10% WAL throttle
  # on developer machines whose Docker storage is already moderately used.
  ingester:
    wal:
      disk_full_threshold: 0.98
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: loki
      ruler: loki
    s3:
      endpoint: cogito-minio.cogito.svc.cluster.local:9000
      region: us-east-1
      accessKeyId: minioadmin
      secretAccessKey: minioadmin
      s3ForcePathStyle: true
      insecure: true

singleBinary:
  replicas: 1
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
test:
  enabled: false
