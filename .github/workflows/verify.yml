name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
      - name: Install locked dependencies
        working-directory: services/${{ matrix.service }}
        run: uv sync --frozen --all-extras
      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: uv run pytest

  github-readonly-mcp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
      - name: Install locked connector dependencies
        working-directory: packages/github/readonly-mcp
        run: uv sync --frozen --all-extras
      - name: Run connector tests
        working-directory: packages/github/readonly-mcp
        run: uv run pytest

  github-readonly-mcp-release-metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
      - id: version
        uses: crmagz/forge/.github/actions/semantic-version@releases/v1
        with:
          tag-prefix: github-readonly-mcp/
          pathspecs: |
            packages/github/readonly-mcp
            components/tools/github_readonly_mcp
            .python-version
      - name: Verify computed release metadata
        if: steps.version.outputs.release-required == 'true'
        working-directory: packages/github/readonly-mcp
        run: uv run --extra dev python scripts/verify_release_metadata.py "${{ steps.version.outputs.version }}"

  chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v4.2.3
      - name: Configure chart repositories
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add temporal https://go.temporal.io/helm-charts
          helm repo add minio https://charts.min.io/
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add grafana-community https://grafana-community.github.io/helm-charts
      - name: Build chart dependencies
        run: helm dependency build charts
      - name: Lint chart
        run: helm lint charts
      - name: Render default values
        run: helm template cogito charts > /dev/null
      - name: Render Kind observability profile
        run: |
          rendered="$(mktemp)"
          helm template cogito charts -f charts/values-kind-observability.yaml > "$rendered"
          grep -Fq 'COGITO_TELEMETRY_OTLP_ENDPOINT: "http://alloy.alloy.svc.cluster.local:4318"' "$rendered"
          grep -Fq 'COGITO_AUDIT_LOGS_LOKI_ENDPOINT: "http://loki.loki.svc.cluster.local:3100"' "$rendered"
          grep -Fq 'name: cogito-minio' "$rendered"
          deploy/observability/kind/install.sh render > "$rendered"
          grep -Fq 'name: alloy' "$rendered"
          grep -Fq 'namespace: loki' "$rendered"
          grep -Fq 'name: tempo' "$rendered"
          grep -Fq 'name: mimir-gateway' "$rendered"
          grep -Fq 'name: grafana' "$rendered"
          grep -Fq 'loki.process "redact"' "$rendered"
          grep -Fq 'disk_full_threshold: 0.98' "$rendered"
          if grep -Fq 'name: mimir-kafka' "$rendered"; then
            echo "Kind observability profile must not render Kafka"
            exit 1
          fi
          if grep -q '^kind: Ingress$' "$rendered"; then
            echo "Kind observability profile must not render an Ingress"
            exit 1
          fi
      - name: Render governed MCP overrides
        run: |
          rendered="$(mktemp)"
          helm template governed-mcp charts --namespace governed-mcp \
            --set mcp.enabled=true \
            --set mcp.service.port=9000 \
            --set mcp.image.repository=separate-mcp \
            --set mcp.image.tag=v9 > "$rendered"
          grep -Fq 'COGITO_MCP_ENABLED: "true"' "$rendered"
          grep -Fq 'cogito_readonly_mcp@1.0.1' "$rendered"
          grep -Fq 'image: "separate-mcp:v9"' "$rendered"
          grep -Fq 'name: COGITO_MCP_PORT' "$rendered"
          grep -Fq 'value: "9000"' "$rendered"
          grep -Fq 'name: governed-mcp-readonly-mcp-ingress' "$rendered"
      - name: Render GitHub read-only MCP connector
        run: |
          rendered="$(mktemp)"
          helm template github-mcp charts --namespace connector-system \
            --set mcp.enabled=true \
            --set mcp.github.enabled=true \
            --set mcp.github.image.repository=separate-github-mcp \
            --set mcp.github.image.tag=v1 \
            --set mcp.github.app.existingSecret=cogito-github-readonly-app \
            --set 'mcp.github.app.allowedRepositories[0]=acme/widget' \
            --set mcp.github.egressProxy.url=http://egress-proxy.connector-system.svc:3128 \
            --set 'mcp.github.egressProxy.networkPolicyPeers[0].ipBlock.cidr=10.0.0.0/8' > "$rendered"
          grep -Fq 'COGITO_MCP_GITHUB_ENABLED: "true"' "$rendered"
          grep -Fq 'COGITO_MCP_TARGET_REPOSITORY_SCOPES: "{\"github_readonly_mcp@1.0.0\":\"acme/widget\"}"' "$rendered"
          grep -Fq 'github_readonly_mcp@1.0.0' "$rendered"
          github_route="$(sed -n 's/.*\\\"route\\\":\\\"\(github_readonly_[a-f0-9]*\)\\\".*/\1/p' "$rendered" | head -n1)"
          test -n "$github_route"
          grep -Fq "      $github_route:" "$rendered"
          grep -Fq 'name: github-mcp-github-readonly-mcp-boundary' "$rendered"
          grep -Fq 'name: COGITO_GITHUB_MCP_PRIVATE_KEY_FILE' "$rendered"
          grep -Fq 'secretName: cogito-github-readonly-app' "$rendered"
          grep -Fq 'image: "separate-github-mcp:v1"' "$rendered"
          grep -Fq 'imagePullPolicy: IfNotPresent' "$rendered"
          grep -Fq 'command: ["python", "-m", "cogito_github_readonly_mcp"]' "$rendered"
          if helm template invalid-github-mcp charts \
            --set mcp.enabled=true \
            --set mcp.github.enabled=true \
            --set mcp.github.app.existingSecret=cogito-github-readonly-app \
            --set 'mcp.github.app.allowedRepositories[0]=acme/widget' \
            --set mcp.github.egressProxy.url=http://egress-proxy.connector-system.svc:3128 \
            --set mcp.github.egressProxy.port=8080 \
            --set 'mcp.github.egressProxy.networkPolicyPeers[0].ipBlock.cidr=10.0.0.0/8' > /dev/null 2>&1; then
            echo "GitHub connector accepted a proxy URL and NetworkPolicy port mismatch"
            exit 1
          fi
          if helm template missing-github-repository charts \
            --set mcp.enabled=true \
            --set mcp.github.enabled=true \
            --set mcp.github.app.existingSecret=cogito-github-readonly-app \
            --set mcp.github.egressProxy.url=http://egress-proxy.connector-system.svc:3128 \
            --set 'mcp.github.egressProxy.networkPolicyPeers[0].ipBlock.cidr=10.0.0.0/8' \
            > /dev/null 2> missing-github-repository.log; then
            echo "GitHub connector accepted a missing repository scope"
            exit 1
          fi
          grep -Fq 'mcp.github.app.allowedRepositories must contain exactly one repository when the GitHub connector is enabled' missing-github-repository.log
          if helm template missing-github-image charts \
            --set mcp.enabled=true \
            --set mcp.github.enabled=true \
            --set mcp.github.image.repository= \
            --set mcp.github.app.existingSecret=cogito-github-readonly-app \
            --set 'mcp.github.app.allowedRepositories[0]=acme/widget' \
            --set mcp.github.egressProxy.url=http://egress-proxy.connector-system.svc:3128 \
            --set 'mcp.github.egressProxy.networkPolicyPeers[0].ipBlock.cidr=10.0.0.0/8' \
            > /dev/null 2> missing-github-image.log; then
            echo "GitHub connector accepted a missing package image repository"
            exit 1
          fi
          grep -Fq 'mcp.github.image.repository is required when the GitHub connector is enabled' missing-github-image.log
      - name: Render production values
        run: |
          helm template cogito charts -f charts/values-production.yaml \
            --set api.image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set worker.image.digest=sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --set litellm.image.digest=sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc \
            > /dev/null
      - name: Render production GitHub connector image pin
        run: |
          rendered="$(mktemp)"
          helm template github-mcp-production charts -f charts/values-production.yaml \
            --set api.image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set worker.image.digest=sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --set litellm.image.digest=sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc \
            --set mcp.enabled=true \
            --set mcp.github.enabled=true \
            --set mcp.github.image.digest=sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd \
            --set mcp.github.app.existingSecret=cogito-github-readonly-app \
            --set 'mcp.github.app.allowedRepositories[0]=acme/widget' \
            --set mcp.github.egressProxy.url=http://egress-proxy.connector-system.svc:3128 \
            --set 'mcp.github.egressProxy.networkPolicyPeers[0].ipBlock.cidr=10.0.0.0/8' > "$rendered"
          grep -Fq 'image: "ghcr.io/crmagz/cogito-github-readonly-mcp@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd"' "$rendered"
      - name: Render external LiteLLM service account
        run: |
          helm template cogito charts \
            --set litellm.serviceAccount.create=false \
            --set-string litellm.serviceAccount.name=cogito-litellm-existing \
            | grep -qx '      serviceAccountName: cogito-litellm-existing'
